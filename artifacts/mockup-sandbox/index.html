<!DOCTYPE html>
<!--
  This file is the entry for ALL routes, including /preview/* canvas iframes (dev only).
  Fonts are loaded here as non-blocking <link> tags (not CSS @import, which is render-blocking).
  Solo le famiglie usate: DM Sans (sito), Inter (mockup app), Outfit (documenti nei mockup).
-->
<html lang="it" style="height: 100%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="Totalone — il sistema operativo per l'arredamento" />
    <meta property="og:description" content="Clienti, preventivi, commesse, consegne, montaggi e performance. Totalone riunisce il lavoro del tuo showroom in un unico sistema." />
    <meta name="description" content="Clienti, preventivi, commesse, consegne, montaggi e performance. Totalone riunisce il lavoro del tuo showroom in un unico sistema." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Totalone — il sistema operativo per l'arredamento" />
    <meta name="twitter:description" content="Clienti, preventivi, commesse, consegne, montaggi e performance in un unico sistema." />

    <title>Totalone — il sistema operativo per l'arredamento</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230b55c6'/><circle cx='16' cy='16' r='6.5' fill='none' stroke='white' stroke-width='3'/></svg>">
    <!-- Non-blocking font bundle: renders with fallback fonts immediately, swaps in when loaded -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..900&amp;family=Inter:wght@400..800&amp;family=Outfit:wght@400..700&amp;display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..900&amp;family=Inter:wght@400..800&amp;family=Outfit:wght@400..700&amp;display=swap"></noscript>
  </head>
  <body style="height: 100%; margin: 0">
    <div id="root" style="height: 100%"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
